  t237: "When a provider returns HTTP 402 (payment required), the auxiliary client auto-falls back to the next one."
  t238: "agent.tool_use_enforcement steers models that describe actions instead of calling tools — auto for GPT/Codex."
  t239: "agent.restart_after_turn_timeout lets in-flight turns finish before /restart enters stop(); restart_drain_timeout is only the force-interrupt budget once stop() begins."
  t240: "agent.api_max_retries (default 3) controls how many times the agent retries a failed API call before surfacing the error — lower it for fast fallback."
  t241: "The gateway caches AIAgent instances per session — destroying this cache breaks Anthropic prompt caching."
  t242: "Any website can expose skills via /.well-known/skills/index.json — the skills hub discovers them automatically."
  t243: "The skills audit log at ~/.hermes/skills/.hub/audit.log tracks every install and removal operation."
  t244: "Stale git worktrees are auto-cleaned on startup: clean, fully-merged trees get pruned; dirty or unpushed work is always preserved."
  t245: "Profiles scope Hermes state via HERMES_HOME; host tool subprocesses keep your real HOME unless terminal.home_mode is profile."
  t246: "HERMES_HOME_MODE env var (octal, e.g. 0701) sets custom directory permissions for web server traversal."
  t247: "Container mode: place .container-mode in HERMES_HOME and the host CLI auto-execs into the container."
  t248: "Ctrl+C has 5 priority tiers: cancel recording → cancel prompts → cancel picker → interrupt agent → exit."
