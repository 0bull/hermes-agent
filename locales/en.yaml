  t355: "hermes fallback manages the fallback_model chain interactively — no hand-editing config.yaml."
  t356: "hermes pairing rotates the DM pairing token — the first messager after rotation claims access to the bot."
  t357: "hermes setup walks first-time users through provider, keys, and platform wiring in one interactive flow."
  t358: "hermes status --deep runs the full health sweep across every component; plain hermes status is the quick view."
  t359: "HERMES_AGENT_TIMEOUT=0 disables the gateway inactivity kill for a running agent — use for long research runs."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 auto-loads repo-local plugins from ./.hermes/plugins/ — trust-gated by design."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 turns off the 'file changed since you read it' guard on patch and write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true lets web tools hit localhost and private networks — off by default in gateway mode."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 auto-installs extra optional-catalog skills on first run per profile."
  t364: "HERMES_BUNDLED_SKILLS points at a custom bundled-skill tree — used by Homebrew and Nix packaging."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 dumps every API request payload to stdout instead of log files."
  t366: "HERMES_OAUTH_TRACE=1 logs redacted OAuth token exchange and refresh attempts for debugging provider auth."
  t367: "HERMES_STREAM_RETRIES (default 3) controls mid-stream reconnect attempts on transient network errors."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false silences the ⚡/⏳/⏩ ack messages when a user messages a busy agent."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (default 180s) sets how often the gateway pings with progress on long turns."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (default 900s) caps how long /restart waits for in-flight runs before forcing."
  t371: "HERMES_CHECKPOINT_TIMEOUT (default 30s) caps filesystem checkpoint creation — raise it on huge monorepos."
  t372: "image_gen.model in config.yaml picks the FAL model: flux-2/klein, gpt-image-2, nano-banana-pro, and more."
  t373: "image_gen.provider routes image generation through a plugin (OpenAI Images, Codex, FAL) instead of the default."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY point vision analysis at any OpenAI-compatible endpoint."
  t375: "security.tirith_fail_open: false makes Hermes block commands when the tirith scanner itself errors out."
  t376: "TIRITH_FAIL_OPEN env var overrides the tirith_fail_open config — a quick toggle without editing config.yaml."
  t377: "--source tool chats are excluded from hermes sessions list by default — set --source explicitly to see them."
  t378: "Session IDs are timestamp-prefixed (20250305_091523_abcd) so sorting works naturally in ls and jq."
  t379: "API_SERVER_MODEL_NAME customizes the model name on /v1/models — essential for multi-profile Open WebUI setups."
  t380: "Dashboard plugins are served from /dashboard-plugins/<name>/ — drop files into ~/.hermes/dashboard-plugins/."
  # Empty-composer example prompts (TUI). Generic on purpose: Hermes is not coding-only.
  placeholder:
    p01: "Ask anything, or type / for commands…"
    p02: "Summarize what's in this folder"
    p03: "Draft a reply to the last email in my inbox"
    p04: "Plan a feature, then build it step by step"
    p05: "Find and fix a failing test"
    p06: "Research this topic and write me a brief"
    p07: "What changed in this repo recently?"
    p08: "Turn these notes into a to-do list"
    p09: "Explain this error and how to fix it"
    p10: "Set a reminder or schedule a recurring task"
    p11: "Type / to browse commands, or Ctrl+P for the palette"
