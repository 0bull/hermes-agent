    no_new:                "No new skills detected."
    total:                 "\n📚 {count} skill(s) available"
    added_header:          "➕ **Added Skills:**"
    removed_header:        "➖ **Removed Skills:**"
    item_with_desc:        "    - {name}: {desc}"
