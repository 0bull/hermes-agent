tips:
  # CLI startup / /new discovery tips (hermes_cli/tips.py). Zero-padded index keeps YAML
  # order stable; pickers read tips.tNNN for the active language.
  t001: "/bg <prompt> runs a task in a separate session while your current one stays free; /btw <question> answers a side question about this conversation without interrupting it."
  t002: "/branch forks the current session so you can explore a different direction without losing progress."
  t003: "/compress manually compresses conversation context when things get long."
  t004: "/rollback lists filesystem checkpoints — restore files the agent modified to any prior state."
  t005: "/rollback diff 2 previews what changed since checkpoint 2 without restoring anything."
  t006: "/rollback 2 src/file.py restores a single file from a specific checkpoint."
  t007: "/title \"my project\" names your session — resume it later with /resume or hermes -c."
  t008: "/resume picks up where you left off in a previously named session."
  t009: "/queue <prompt> queues a message for the next turn without interrupting the current one."
  t010: "/undo removes the last user/assistant exchange from the conversation."
  t011: "/retry resends your last message — useful when the agent's response wasn't quite right."
  t012: "/verbose cycles tool progress display: off → new → all → verbose."
  t013: "/reasoning high increases the model's thinking depth. /reasoning show displays the reasoning."
  t014: "/fast toggles priority processing for faster API responses (provider-dependent)."
  t015: "/yolo skips all dangerous command approval prompts for the rest of the session."
  t016: "/model lets you switch models mid-session — try /model sonnet or /model gpt-5."
  t017: "/model --global changes your default model permanently."
  t018: "/personality pirate sets a fun personality — 14 built-in options from kawaii to shakespeare."
  t019: "/skin changes the CLI theme — try ares, mono, slate, poseidon, or charizard."
  t020: "/statusbar toggles a persistent bar showing model, tokens, context fill %, cost, and duration."
  t021: "/tools disable browser temporarily removes browser tools for the current session."
  t022: "/browser connect attaches browser tools to your running Chromium-family browser via CDP."
  t023: "/plugins lists installed plugins and their status."
  t024: "/cron manages scheduled tasks — set up recurring prompts with delivery to any platform."
  t025: "/reload-mcp hot-reloads MCP server configuration without restarting."
  t026: "/usage shows token usage, cost breakdown, and session duration."
  t027: "/insights shows usage analytics for the last 30 days."
  t028: "/paste checks your clipboard for an image and attaches it to your next message."
  t029: "/profile shows which profile is active and its home directory."
  t030: "/config shows your current configuration at a glance."
  t031: "/stop kills all running background processes spawned by the agent."
  t032: "@file:path/to/file.py injects file contents directly into your message."
  t033: "@file:main.py:10-50 injects only lines 10-50 of a file."
  t034: "@folder:src/ injects a directory tree listing."
  t035: "@diff injects your unstaged git changes into the message."
  t036: "@staged injects your staged git changes (git diff --staged)."
  t037: "@git:5 injects the last 5 commits with full patches."
  t038: "@url:https://example.com fetches and injects a web page's content."
  t039: "Typing @ triggers filesystem path completion — navigate to any file interactively."
  t040: "Combine multiple references: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Alt+Enter inserts a newline for multi-line input. (Windows Terminal intercepts Alt+Enter — use Ctrl+Enter instead.)"
  t042: "Ctrl+C interrupts the agent. Double-press within 2 seconds to force exit."
  t043: "Ctrl+Z suspends Hermes to the background — run fg in your shell to resume."
  t044: "Tab accepts auto-suggestion ghost text or autocompletes slash commands."
  t045: "Type a new message while the agent is working to interrupt and redirect it."
  t046: "Alt+V pastes an image from your clipboard into the conversation."
  t047: "Pasting 5+ lines auto-saves to a file and inserts a compact reference instead."
  t048: "hermes -c resumes your most recent CLI session. hermes -c \"project name\" resumes by title."
  t049: "hermes -w creates an isolated git worktree — perfect for parallel agent workflows."
  t050: "hermes -w -q \"Fix issue #42\" combines worktree isolation with a one-shot query."
  t051: "hermes chat -t web,terminal enables only specific toolsets for a focused session."
  t052: "hermes chat -s github-pr-workflow preloads a skill at launch."
  t053: "hermes chat -q \"query\" runs a single non-interactive query and exits."
  t054: "hermes chat --max-turns 1000 overrides the default 500-iteration limit per turn."
  t055: "hermes chat --checkpoints enables filesystem snapshots before every destructive file change."
  t056: "hermes --yolo bypasses all dangerous command approval prompts for the entire session."
  t057: "hermes chat --source telegram tags the session for filtering in hermes sessions list."
  t058: "hermes -p work chat runs under a specific profile without changing your default."
  t059: "hermes doctor --fix diagnoses and auto-repairs config and dependency issues."
  t060: "hermes dump outputs a compact setup summary — great for bug reports."
  t061: "hermes config set KEY VALUE auto-routes secrets to .env and everything else to config.yaml."
  t062: "hermes config edit opens config.yaml in your default editor."
  t063: "hermes config check scans for missing or stale configuration options."
  t064: "hermes sessions browse opens an interactive session picker with search."
  t065: "hermes sessions stats shows session counts by platform and database size."
  t066: "hermes sessions prune --older-than 30 cleans up old sessions."
  t067: "hermes skills search react --source skills-sh searches the skills.sh public directory."
  t068: "hermes skills check scans installed hub skills for upstream updates."
  t069: "hermes skills tap add myorg/skills-repo adds a custom GitHub skill source."
  t070: "hermes skills snapshot export setup.json exports your skill configuration for backup or sharing."
  t071: "hermes mcp add github --command npx adds MCP servers from the command line."
  t072: "hermes mcp serve runs Hermes itself as an MCP server for other agents."
  t073: "hermes auth add lets you add multiple API keys for credential pool rotation."
  t074: "hermes completion bash >> ~/.bashrc enables tab completion for all commands and profiles."
  t075: "hermes logs -f follows agent.log in real time. --level WARNING --since 1h filters output."
  t076: "hermes backup creates a zip backup of your entire Hermes home directory."
  t077: "hermes profile create coder creates an isolated profile that becomes its own command."
  t078: "hermes profile create work --clone copies your current config and keys to a new profile."
  t079: "hermes update syncs new bundled skills to ALL profiles automatically."
  t080: "hermes gateway install sets up Hermes as a system service (systemd/launchd)."
  t081: "hermes memory setup lets you configure an external memory provider (Honcho, Mem0, etc.)."
  t082: "hermes webhook subscribe creates event-driven webhook routes with HMAC validation."
  t083: "Save money: hermes tools disables unused tools, hermes skills config trims skills down."
  t084: "/reasoning low or /reasoning minimal cuts thinking depth below the default (medium) — faster, cheaper responses."
  t085: "hermes models routes vision, compression, and aux tasks to cheaper models — cuts background token cost 85%+ without downgrading your main chat model."
  t086: "Set display.bell_on_complete: true in config.yaml to hear a bell when long tasks finish."
  t087: "Set display.streaming: true to see tokens appear in real time as the model generates."
  t088: "Set display.show_reasoning: true to watch the model's chain-of-thought reasoning."
  t089: "Set display.compact: true to reduce whitespace in output for denser information."
  t090: "Set display.busy_input_mode: queue to queue messages instead of interrupting the agent, or steer to inject them mid-run via /steer."
  t091: "Set display.resume_display: minimal to skip the full conversation recap on session resume."
  t092: "Set compression.threshold: 0.50 to control when auto-compression fires (default: 50% of context)."
  t093: "Set agent.max_turns: 1000 to let the agent take more tool-calling steps per turn."
  t094: "Set file_read_max_chars: 200000 to increase the max content per read_file call."
  t095: "Set approvals.mode: smart to let an LLM auto-approve safe commands and auto-deny dangerous ones."
  t096: "Set fallback_model in config.yaml to automatically fail over to a backup provider."
  t097: "Set privacy.redact_pii: true to hash user IDs and phone numbers before sending to the LLM."
  t098: "Set browser.record_sessions: true to auto-record browser sessions as WebM videos."
  t099: "Set worktree: true in config.yaml to always create a git worktree (same as hermes -w)."
  t100: "Set security.website_blocklist.enabled: true to block specific domains from web tools."
  t101: "Set cron.wrap_response: false to deliver raw agent output without the cron header/footer."
  t102: "HERMES_TIMEZONE overrides the server timezone with any IANA timezone string."
  t103: "Environment variable substitution works in config.yaml: use ${VAR_NAME} syntax."
  t104: "Quick commands in config.yaml run shell commands instantly with zero token usage."
  t105: "Custom personalities can be defined in config.yaml under agent.personalities."
  t106: "provider_routing controls OpenRouter provider sorting, whitelisting, and blacklisting."
  t107: "execute_code runs Python scripts that call Hermes tools programmatically — results stay out of context."
  t108: "delegate_task spawns up to 10 concurrent sub-agents by default (delegation.max_concurrent_children) with isolated contexts for parallel work."
  t109: "web_extract works on PDF URLs — pass any PDF link and it converts to markdown."
  t110: "search_files is ripgrep-backed and faster than grep — use it instead of terminal grep."
  t111: "patch uses 9 fuzzy matching strategies so minor whitespace differences won't break edits."
  t112: "patch supports V4A format for bulk multi-file edits in a single call."
  t113: "read_file suggests similar filenames when a file isn't found."
  t114: "read_file auto-deduplicates — re-reading an unchanged file returns a lightweight stub."
  t115: "browser_vision takes a screenshot and analyzes it with AI — works for CAPTCHAs and visual content."
  t116: "browser_console can evaluate JavaScript expressions in the page context."
  t117: "image_generate creates images with FLUX 2 Pro and automatic 2x upscaling."
  t118: "text_to_speech converts text to audio — plays as voice bubbles on Telegram."
  t119: "send_message can reach any connected messaging platform from within a session."
  t120: "The todo tool helps the agent track complex multi-step tasks during a session."
  t121: "session_search performs full-text search across ALL past conversations."
  t122: "The agent automatically saves preferences, corrections, and environment facts to memory."
  t123: "/moa routes one hard prompt through your configured Mixture of Agents model set."
  t124: "Terminal commands support background mode with notify_on_complete for long-running tasks."
  t125: "Terminal background processes support watch_patterns to alert on specific output lines."
  t126: "The terminal tool supports 6 backends: local, Docker, SSH, Modal, Daytona, and Singularity."
  t127: "Each profile gets its own config, API keys, memory, sessions, skills, and cron jobs."
  t128: "Profile names become shell commands — 'hermes profile create coder' creates the 'coder' command."
  t129: "hermes profile export coder -o backup.tar.gz creates a portable profile archive."
  t130: "If two profiles accidentally share a bot token, the second gateway is blocked with a clear error."
  t131: "Sessions auto-generate descriptive titles after the first exchange — no manual naming needed."
  t132: "Session titles support lineage: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "When exiting, Hermes prints a resume command with session ID and stats."
  t134: "hermes sessions export backup.jsonl exports all sessions for backup or analysis."
  t135: "hermes -r SESSION_ID resumes any specific past session by its ID."
  t136: "Memory is a frozen snapshot — changes appear in the system prompt only at next session start."
  t137: "Memory entries are automatically scanned for prompt injection and exfiltration patterns."
  t138: "The agent has two memory stores: personal notes (~2200 chars) and user profile (~1375 chars)."
  t139: "Corrections you give the agent (\"no, do it this way\") are often auto-saved to memory."
  t140: "Over 80 bundled skills covering github, creative, mlops, productivity, research, and more."
  t141: "Every installed skill automatically becomes a slash command — type / to see them all."
  t142: "hermes skills install official/security/1password installs optional skills from the repo."
  t143: "Skills can restrict to specific OS platforms — some only load on macOS or Linux."
  t144: "skills.external_dirs in config.yaml lets you load skills from custom directories."
  t145: "The agent can create its own skills as procedural memory using skill_manage."
  t146: "/plan writes a markdown implementation plan to .hermes/plans/ without executing anything."
  t147: "Cron jobs can attach skills: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Cron delivery targets include telegram, discord, slack, email, sms, and 12+ more platforms."
  t149: "If a cron response starts with [SILENT], delivery is suppressed — useful for monitoring-only jobs."
  t150: "Cron supports relative delays (30m), intervals (every 2h), cron expressions, and ISO timestamps."
  t151: "Cron jobs run in completely fresh agent sessions — prompts must be self-contained."
  t152: "Voice mode works with zero API keys if faster-whisper is installed (free local speech-to-text)."
  t153: "Five TTS providers available: Edge TTS (free), ElevenLabs, OpenAI, NeuTTS (free local), MiniMax."
  t154: "/voice on enables voice mode in the CLI. Ctrl+B toggles push-to-talk recording."
  t155: "Streaming TTS plays sentences as they generate — you don't wait for the full response."
  t156: "Voice messages on Telegram, Discord, WhatsApp, and Slack are auto-transcribed."
  t157: "Hermes runs on 21 messaging platforms: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email, and more."
  t158: "hermes gateway install sets it up as a system service that starts on boot."
  t159: "DingTalk uses Stream Mode — no webhooks or public URL needed."
  t160: "BlueBubbles brings iMessage to Hermes via a local macOS server."
  t161: "Webhook routes support HMAC validation, rate limiting, and event filtering."
  t162: "The API server exposes an OpenAI-compatible endpoint compatible with Open WebUI and LibreChat."
  t163: "Discord voice channel mode: the bot joins VC, transcribes speech, and talks back."
  t164: "group_sessions_per_user: true gives each person their own session in group chats."
  t165: "/sethome marks a chat as the home channel for cron job deliveries."
  t166: "The gateway supports inactivity-based timeouts — active agents can run indefinitely."
  t167: "Dangerous command approval has 4 tiers: once, session, always (permanent allowlist), deny."
  t168: "Smart approval mode uses an LLM to auto-approve safe commands and flag dangerous ones."
  t169: "SSRF protection blocks private networks, loopback, link-local, and cloud metadata addresses."
  t170: "Tirith pre-exec scanning detects homograph URL spoofing and pipe-to-interpreter patterns."
  t171: "MCP subprocesses receive a filtered environment — only safe system vars pass through."
  t172: "Context files (.hermes.md, AGENTS.md) are security-scanned for prompt injection before loading."
  t173: "command_allowlist in config.yaml permanently approves specific shell command patterns."
  t174: "Context auto-compresses when it reaches the threshold — memories are flushed and history summarized."
  t175: "The status bar turns yellow, then orange, then red as context fills up."
  t176: "SOUL.md is the agent's primary identity file — customize it to shape behavior."
  t177: "Hermes loads project context from .hermes.md, AGENTS.md, CLAUDE.md, or .cursorrules (first match)."
  t178: "Subdirectory AGENTS.md files are discovered progressively as the agent navigates into folders."
  t179: "Context files are capped at 20,000 characters with smart head/tail truncation."
  t180: "Five browser providers: local Chromium, Browserbase, Browser Use, Camofox, and Firecrawl."
  t181: "Camofox is an anti-detection browser — Firefox fork with C++ fingerprint spoofing."
  t182: "browser_navigate returns a page snapshot automatically — no need to call browser_snapshot after."
  t183: "browser_vision with annotate=true overlays numbered labels on interactive elements."
  t184: "hermes mcp opens an interactive picker of Nous-approved MCPs you can install in one keystroke."
  t185: "hermes mcp catalog lists Nous-approved MCP servers shipped with the repo."
  t186: "hermes mcp install <name> installs a catalog entry, prompts for credentials, and lets you pick which of its tools to enable."
  t187: "MCP servers are configured in config.yaml — both stdio and HTTP transports supported."
  t188: "Per-server tool filtering: tools.include whitelists and tools.exclude blacklists specific tools."
  t189: "MCP servers auto-generate toolsets at runtime — hermes tools can toggle them per platform."
  t190: "MCP OAuth support: auth: oauth enables browser-based authorization with PKCE."
  t191: "Checkpoints have zero overhead when no files are modified — enabled by default."
  t192: "A pre-rollback snapshot is saved automatically so you can undo the undo."
  t193: "/rollback also undoes the conversation turn, so the agent doesn't remember rolled-back changes."
  t194: "Checkpoints use shadow repos in ~/.hermes/checkpoints/ — your project's .git is never touched."
  t195: "batch_runner.py processes hundreds of prompts in parallel for training data generation."
  t196: "hermes chat -Q enables quiet mode for programmatic use — suppresses banner and spinner."
  t197: "Trajectory saving (--save-trajectories) captures full tool-use traces for model training."
  t198: "Three plugin types: general (tools/hooks), memory providers, and context engines."
  t199: "hermes plugins install owner/repo installs plugins directly from GitHub."
  t200: "External memory providers: Honcho, OpenViking, Mem0 bundled; Hindsight and more via hermes plugins install."
  t201: "Plugin hooks include pre/post_tool_call, pre/post_llm_call, and transform_terminal_output for output canonicalization."
  t202: "Prompt caching (Anthropic) reduces costs by reusing cached system prompt prefixes."
  t203: "The agent auto-generates session titles in a background thread — zero latency impact."
  t204: "Smart model routing can auto-route simple queries to a cheaper model."
  t205: "Slash commands support prefix matching: /h resolves to /help, /mod to /model."
  t206: "Dragging a file path into the terminal auto-attaches images or sends as context."
  t207: ".worktreeinclude in your repo root lists gitignored files to copy into worktrees."
  t208: "hermes acp runs Hermes as an ACP server for VS Code, Zed, and JetBrains integration."
  t209: "Custom providers: save named endpoints in config.yaml under custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT injects a system prompt that's never persisted to history."
  t211: "credential_pool_strategies supports fill_first, round_robin, least_used, and random rotation."
  t212: "hermes auth add nous or hermes auth add openai-codex sets up OAuth-based providers."
  t213: "The API server supports both Chat Completions and Responses API with server-side state."
  t214: "tool_preview_length: 0 in config shows full file paths in the spinner's activity feed."
  t215: "hermes status --deep runs deeper diagnostic checks across all components."
  t216: "Cron jobs can attach a Python script (--script) whose stdout is injected into the prompt as context."
  t217: "Cron scripts live in ~/.hermes/scripts/ and run before the agent — perfect for data collection pipelines."
  t218: "prefill_messages_file in config.yaml injects few-shot examples into every API call, never saved to history."
  t219: "SOUL.md completely replaces the agent's default identity — rewrite it to make Hermes your own."
