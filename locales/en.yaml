# Hermes static-message catalog -- English (baseline / source of truth)
#
# Only user-facing static messages from the CLI approval prompt and a handful
# of gateway slash-command replies live here.  Agent-generated output, log
# lines, error tracebacks, tool outputs, and slash-command descriptions stay
# in English and are NOT translated -- see agent/i18n.py for scope rationale.
#
# Keys are dotted paths; nesting below is purely for readability.  Values may
# contain {placeholder} tokens for str.format substitution.  When adding a
# new key, add it to EVERY locale file (en/zh/ja/de/es/fr/tr/uk) in the same commit --
# tests/agent/test_i18n.py asserts catalog parity.

approval:
  # CLI approval prompt -- shown when a dangerous command needs user review.
  dangerous_header: "⚠️  DANGEROUS COMMAND: {description}"
  choose_long:     "      [o]nce  |  [s]ession  |  [a]lways  |  [d]eny"
  choose_short:    "      [o]nce  |  [s]ession  |  [d]eny"
  prompt_long:     "      Choice [o/s/a/D]: "
  prompt_short:    "      Choice [o/s/D]: "
  choose_smart_deny: "      [o]nce  |  [d]eny"
  prompt_smart_deny: "      Choice [o/D]: "
  smart_deny_once_inputs: "o,once"
  smart_deny_deny_inputs: "d,deny"
  timeout:         "      ⏱ No answer in {waited} — the command was not run. Ask again to retry, or raise the limit: hermes config set approvals.timeout {suggested}"
  allowed_once:    "      ✓ Allowed once"
  allowed_session: "      ✓ Allowed for this session"
  allowed_always:  "      ✓ Added to permanent allowlist"
  denied:          "      ✗ Denied"
  cancelled:       "      ✗ Cancelled"
  blocklist_message: "This command is on the unconditional blocklist and cannot be approved."
  # Human one-liner shown after an approval settles (tools/approval.py ``user_summary``); the
  # model-facing BLOCKED text stays English. {noun} is approval.noun.*, {window} approval.window.*.
  summary:
    denied:        "You denied this {noun} — it did not run."
    timeout:       "No answer within {window} — the {noun} did not run."
    notify_failed: "The approval request could not be delivered — the {noun} did not run."
    cancelled:     "The approval prompt was withdrawn or never reached you — the {noun} did not run."
    blocked:       "This {noun} is not allowed in an unattended session — it did not run."
    default:       "This {noun} did not run."
  noun:
    command: "command"
    code:    "code"
    action:  "action"
  # Approval timeout window (tools/approval_context.py format_approval_window): 300 → "5 minutes".
  window:
    hour_one:     "{count} hour"
    hour_other:   "{count} hours"
    minute_one:   "{count} minute"
    minute_other: "{count} minutes"
    second_one:   "{count} second"
    second_other: "{count} seconds"

gateway:
