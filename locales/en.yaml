  t221: "/compress <focus topic> allocates 60-70% of the summary budget to your topic and aggressively trims the rest."
  t222: "On second+ compression, the compressor updates the previous summary instead of starting from scratch."
  t223: "Before a gateway session reset, Hermes auto-flushes important facts to memory in the background."
  t224: "network.force_ipv4: true in config.yaml fixes hangs on servers with broken IPv6 — monkey-patches socket."
  t225: "The terminal tool annotates common exit codes: grep returning 1 = 'No matches found (not an error)'."
  t226: "Failed foreground terminal commands auto-retry up to 3 times with exponential backoff (2s, 4s, 8s)."
  t227: "Bare sudo commands are auto-rewritten to pipe SUDO_PASSWORD from .env — no interactive prompt needed."
  t228: "execute_code helpers require explicit imports: from hermes_tools import json_parse, shell_quote, retry."
  t229: "execute_code's 7 sandbox tools (web_search, terminal, read/write/search/patch) use RPC — never enter context."
  t230: "Reading the same file region 3+ times triggers a warning. At 4+, it's hard-blocked to prevent loops."
  t231: "write_file and patch detect if a file was externally modified since the last read and warn about staleness."
  t232: "V4A patch format supports Add File, Delete File, and Move File directives — not just Update."
  t233: "MCP servers can request LLM completions back via sampling — the agent becomes a tool for the server."
  t234: "MCP servers send notifications/tools/list_changed to trigger automatic tool re-registration without restart."
  t235: "delegate_task with acp_command: 'claude' spawns Claude Code as a child agent from any platform."
